[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    integration: testes que requerem LLM_BASE_URL configurado e ingestão prévia (ver docs/CRITERIOS-DE-ACEITE.md)
    unit: cenário BDD sem LLM externo — apenas modelos locais e mocks (não requer LLM_BASE_URL)
    live_llm: cenário BDD com LLM real (Flow CI&T) — requer LLM_BASE_URL + chroma_data populado
    criterio_3: CRITERIOS-DE-ACEITE §3 — perguntas respondidas com fonte RAG
    criterio_4: CRITERIOS-DE-ACEITE §4 — perguntas fora do escopo não inventam resposta
    criterio_5: CRITERIOS-DE-ACEITE §5 — guardrails de input e output ativos
    criterio_6: CRITERIOS-DE-ACEITE §6 — traço de observabilidade legível e rastreável
