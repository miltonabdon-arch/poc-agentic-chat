services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./data:/app/data
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
  mock-services:
    build: ./mock_services
    ports:
      - "8001:8001"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
    command: uvicorn app:app --host 0.0.0.0 --port 8001
