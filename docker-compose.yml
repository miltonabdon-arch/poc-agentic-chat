services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - FLOW_TENANT=${FLOW_TENANT}
      - FLOW_AGENT=${FLOW_AGENT}
      - MOCK_SERVICES_URL=http://mock-services:8001
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000
    depends_on:
      - mock-services
  mock-services:
    build: ./mock_services
    ports:
      - "8001:8001"
    command: uvicorn app:app --host 0.0.0.0 --port 8001

volumes:
  hf_cache:
