image: python:3.12-slim

definitions:
  caches:
    pip: ~/.cache/pip

pipelines:
  default:
    - step:
        name: Lint
        caches:
          - pip
        script:
          - pip install -r requirements.txt
          - ruff check .

    - step:
        name: Testes (unitários — sem dependência de LLM)
        caches:
          - pip
        script:
          - pip install -r requirements.txt
          - pytest -m "not integration" --cov=. --cov-report=term-missing

    - step:
        name: Build imagem Docker
        script:
          - docker build -t poc-agent-platform-oci:${BITBUCKET_COMMIT} .
        services:
          - docker
